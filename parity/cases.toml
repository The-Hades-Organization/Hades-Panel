# Matriz de paridade do painel: `hades panel dump <rota>` (TS, Hades-Skill) contra `hades-panel dump <rota>`.
# O argv é o do binário; o lado TS ganha o subcomando `panel` por `ts_cmd = ["{skill}/src/cli.ts", "panel"]`. A skill
# (--ts e HADES_SKILL_DIR) é a montada por parity/montar-skill.sh. Fixtures de `$D`, WORK_ROOT e /proc fictícias.
# Os casos entram com os leitores: Configurações, Fila e loop, Orquestração, Consumo e Snapshot.
# Configurações: `config`, `config/inherited`, `config/export` e `doctor`. O catálogo vem do kit da skill montada
# (setup-config.sh); `config/preview` é POST e fica nos testes unitários do hades-panel-core.

[[case]]
id = "config.vazio"
fixture = "cfg-vazio"
argv = ["config"]
ts_cmd = ["{skill}/src/cli.ts", "panel"]
setup = "setup-config.sh"
env = { HADES_NOW = "2026-11-23T15:04:05Z" }
compare = ["stdout", "stderr", "exit"]

