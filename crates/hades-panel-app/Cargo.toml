[package]
name = "hades-panel-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "hades_panel_app"
path = "src/lib.rs"

[[bin]]
name = "hades-panel-app"
path = "src/main.rs"

[dependencies]
hades-panel-core = { path = "../hades-panel-core" }
hades-core.workspace = true
serde_json.workspace = true
hades-ui.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
moirai-app = { workspace = true, optional = true }
thanatos-app = { workspace = true, optional = true }
caronte-app = { workspace = true, optional = true }
cerberus-app = { workspace = true, optional = true }
minos-app = { workspace = true, optional = true }

[features]
default = ["moirai", "thanatos", "caronte", "cerberus", "minos"]
moirai = ["dep:moirai-app"]
thanatos = ["dep:thanatos-app"]
caronte = ["dep:caronte-app"]
cerberus = ["dep:cerberus-app"]
minos = ["dep:minos-app"]

[lints]
workspace = true
