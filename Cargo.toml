[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/The-Hades-Organization/Hades-Panel"

[workspace.dependencies]
hades-core = { git = "https://github.com/The-Hades-Organization/Hades-Core", tag = "v0.2.7" }
hades-ui = { git = "https://github.com/The-Hades-Organization/Hades-UI", tag = "v0.3.0" }
serde_json = { version = "1", features = ["preserve_order"] }
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", default-features = false, features = ["wayland", "x11"] }
gpui-component = "=0.9.0"
moirai-app = { git = "https://github.com/The-Hades-Organization/Moirai", tag = "v0.1.0" }
thanatos-app = { git = "https://github.com/The-Hades-Organization/Thanatos", tag = "v0.1.0" }
caronte-app = { git = "https://github.com/The-Hades-Organization/Caronte", tag = "v0.1.0" }
cerberus-app = { git = "https://github.com/The-Hades-Organization/Cerberus", tag = "v0.2.0" }
minos-app = { git = "https://github.com/The-Hades-Organization/Minos", tag = "v0.2.0" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev.package."*"]
opt-level = 2
