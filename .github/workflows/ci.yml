name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
  pull_request:
    paths-ignore:
      - '**.md'
      - LICENSE
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # sha do Hades-Skill contra o qual o job parity roda; trocar é mudança explícita, e o diff da matriz mostra o que mudou no TS
  HADES_SKILL_SHA: f5c887ee33d58574e182ee1209f365f798d9cf7d
  # tag do Hades-Core de onde sai o runner da matriz
  HADES_CORE_TAG: v0.2.7

permissions:
  contents: read

jobs:
  parity:
    name: Paridade TS x Rust
    if: github.event_name != 'schedule'
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: The-Hades-Organization/Hades-Skill
          ref: ${{ env.HADES_SKILL_SHA }}
          path: hades-skill
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4 # a do bun.lock da skill
      - name: Dependências da skill
        working-directory: hades-skill
        run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Runner da matriz (Hades-Core)
        run: cargo install --locked --git https://github.com/The-Hades-Organization/Hades-Core --tag "$HADES_CORE_TAG" --root "$RUNNER_TEMP/hades-parity" hades-parity
      - name: Compilar o hades-panel
        run: cargo build --locked -p hades-panel-cli
      - name: Montar a skill
        run: parity/montar-skill.sh hades-skill "$RUNNER_TEMP/skill"
      - name: Matriz de paridade
        run: >
          "$RUNNER_TEMP/hades-parity/bin/hades-parity" run
          --cases parity/cases.toml
          --ts "$RUNNER_TEMP/skill"
          --rust target/debug/hades-panel

  core:
    name: Core (sem gpui)
    if: github.event_name != 'schedule'
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude hades-panel-app --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude hades-panel-app --locked

  app:
    name: App (gpui)
    if: github.event_name != 'schedule'
    timeout-minutes: 40
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Dependências do Linux
        run: ./scripts/linux-deps.sh
      - run: cargo clippy -p hades-panel-app --all-targets --locked -- -D warnings

  app-build:
    name: App build (gpui)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Dependências do Linux
        run: ./scripts/linux-deps.sh
      - run: cargo build -p hades-panel-app --locked
